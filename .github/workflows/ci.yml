name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bikeflow
          POSTGRES_USER: bikeflow
          POSTGRES_PASSWORD: bikeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikeflow -d bikeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bikeflow
      POSTGRES_USER: bikeflow
      POSTGRES_PASSWORD: bikeflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Create tables and views
        run: python scripts/init_db.py

      - name: Test
        run: python -m pytest -q
